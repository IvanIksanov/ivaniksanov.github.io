<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <script src="analytics-consent.shared.js?v=5"></script>
    <script src="google-tag-manager.shared.js?v=20261027-1"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Вопросы для Fullstack QA — карта собеседования | QAtoDev</title>
    <meta name="description" content="Изучайте вопросы для Fullstack QA на интерактивной карте. Выбирайте темы, открывайте связанные вопросы и готовьтесь к техническому собеседованию.">
    <script>
        (function () {
            const theme = localStorage.getItem('theme');
            if (theme === 'dark' || theme === 'light') document.documentElement.dataset.theme = theme;
        })();
    </script>
    <script src="auth.bootstrap.shared.js?v=8.9.4"></script>
    <link rel="stylesheet" href="header.css?v=8.9.48">
    <link rel="stylesheet" href="questions.css?v=8.9.32">
    <link rel="stylesheet" href="questions-map.css?v=1.0.13">
    <link rel="icon" href="img/QAtoDev_small_main.png" sizes="100x100" type="image/png">
    <script src="favicon.shared.js?v=1"></script>
    <link rel="canonical" href="https://qatodev.ru/questions-map.html">
</head>
<body class="questions-map-page interview-map-page">
<script src="site-header.shared.js?v=2"></script>

<main class="questions-map-main">
    <div class="questions-view-switcher" data-view="map" role="group" aria-label="Вид вопросов">
        <span class="questions-view-switcher__label">Список</span>
        <a class="questions-view-switcher__track" href="questions.html" aria-label="Показать список вопросов">
            <span class="questions-view-switcher__thumb" aria-hidden="true"></span>
        </a>
        <span class="questions-view-switcher__label" aria-current="page">Карта</span>
    </div>
    <p id="questions-map-status" class="questions-map-status" role="status" aria-live="polite"></p>
    <div class="questions-map-workspace" id="questions-map-workspace" hidden>
        <section class="questions-map-scroller" aria-label="Ветви вопросов" tabindex="0">
            <div class="questions-map-canvas" id="questions-map-canvas">
                <svg class="questions-map-lines" id="questions-map-lines" aria-hidden="true"></svg>
                <svg class="questions-map-trace" id="questions-map-trace" aria-hidden="true"></svg>
                <div class="questions-map-root" id="questions-map-root">
                    <div class="questions-map-intro" id="questions-map-intro">
                        <h1>Вопросы для Fullstack QA</h1>
                        <div class="questions-map-filters" role="group" aria-label="Язык автоматизации">
                            <button class="questions-map-filter" type="button" data-language="java" aria-pressed="true">Java</button>
                            <button class="questions-map-filter" type="button" data-language="python" aria-pressed="false">Python</button>
                            <button class="questions-map-filter" type="button" data-language="javascript" aria-pressed="false">JavaScript</button>
                        </div>
                    </div>
                </div>
            </div>
        </section>
        <aside class="questions-map-answer" id="questions-map-answer" aria-label="Ответ на выбранный вопрос" hidden>
            <button class="questions-map-answer__close" id="questions-map-answer-close" type="button" aria-label="Закрыть ответ" title="Закрыть ответ">
                <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            </button>
            <div class="questions-map-answer__heading">
                <div class="questions-map-answer__title-row">
                    <span class="questions-map-answer__category" id="questions-map-answer-category"></span>
                    <h2 id="questions-map-answer-title">Выберите вопрос на карте</h2>
                </div>
                <p id="questions-map-answer-status" role="status" aria-live="polite"></p>
            </div>
            <iframe id="questions-map-answer-frame" title="Ответ, отметки и дополнение ИИ" data-src="questions.html?map_embed=1"></iframe>
        </aside>
    </div>
</main>

<script src="header.js?v=8.9.35"></script>
<script src="theme-toggle.shared.js?v=1"></script>
<script src="questions-map.js?v=1.0.18"></script>
</body>
</html>
