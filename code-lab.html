<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <script src="analytics-consent.shared.js?v=6"></script>
    <script src="google-tag-manager.shared.js?v=20261027-1"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <script src="page-zoom-lock.shared.js?v=2"></script>
    <title>Код-полигон — SQL и API на локальном стенде | QAtoDev</title>
    <meta name="description" content="Практика SQL и API в браузере: пишите запросы, запускайте локальные проверки и разбирайте результат без отправки кода на сервер." />
    <script>
        (function () {
            const saved = localStorage.getItem('theme');
            if (saved === 'dark' || saved === 'light') {
                document.documentElement.setAttribute('data-theme', saved);
            }
        })();
    </script>
    <script src="auth.bootstrap.shared.js?v=8.9.7"></script>
    <link rel="stylesheet" href="header.css?v=8.9.48">
    <link rel="stylesheet" href="styles.css?v=1.0.1">
    <link rel="stylesheet" href="code-lab.css?v=1">
    <link rel="icon" href="img/QAtoDev_small_main.png" sizes="100x100" type="image/png">
    <script src="favicon.shared.js?v=1"></script>
    <script src="metrika.shared.js?v=20261027-1"></script>
    <link rel="canonical" href="https://qatodev.ru/code-lab.html">
    <meta name="robots" content="noindex">
</head>
<body>
<script src="site-header.shared.js?v=4"></script>

<main class="cl-page">
    <header class="cl-head">
        <div class="cl-head__copy">
            <p class="cl-kicker">Практика · локальный стенд</p>
            <h1>Код-полигон</h1>
            <p class="cl-lead">SQL и API в браузере. Код не отправляется на сервер: проверка выполняется локально.</p>
        </div>
        <div class="cl-progress" aria-live="polite">
            <span id="cl-solved">0 / 8</span>
            <span>решено</span>
        </div>
    </header>

    <nav class="cl-tracks" aria-label="Направление задач" id="cl-tracks"></nav>

    <div class="cl-task-strip" id="cl-task-strip" aria-label="Задачи"></div>

    <section class="cl-workspace">
        <div class="cl-column">
            <article class="cl-panel cl-task">
                <div class="cl-task__meta">
                    <span class="cl-badge" id="cl-difficulty">—</span>
                    <span class="cl-topics" id="cl-topics"></span>
                </div>
                <h2 id="cl-title">Выберите задачу</h2>
                <p id="cl-description"></p>
                <details class="cl-hints">
                    <summary>Подсказка</summary>
                    <ul id="cl-hints"></ul>
                </details>
            </article>

            <section class="cl-panel cl-editor-panel">
                <div class="cl-editor-head">
                    <span class="cl-editor-lang" id="cl-editor-lang">SQL</span>
                    <div class="cl-editor-actions">
                        <button type="button" class="cl-btn cl-btn--ghost" id="cl-reset">Сбросить</button>
                        <button type="button" class="cl-btn cl-btn--primary" id="cl-run">Запустить</button>
                    </div>
                </div>
                <div id="cl-editor" class="cl-editor" aria-label="Редактор кода"></div>
                <p class="cl-editor-note" id="cl-editor-note">Ctrl/Cmd + Enter — запустить</p>
            </section>
        </div>

        <aside class="cl-panel cl-result" id="cl-result" aria-live="polite">
            <div class="cl-result__head">
                <h2>Результат</h2>
                <span class="cl-status cl-status--idle" id="cl-status">—</span>
            </div>
            <div class="cl-result__body" id="cl-result-body">
                <p class="cl-muted">Запустите решение, чтобы увидеть проверку.</p>
            </div>
        </aside>
    </section>
</main>

<footer class="qatodev">
    <p>&copy; <span class="footer-year" data-footer-year></span> QAtoDev</p>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.23.4/ace.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.23.4/mode-sql.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.23.4/mode-javascript.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.23.4/theme-chrome.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.23.4/theme-dracula.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="code-lab-tasks.shared.js?v=1"></script>
<script src="code-lab.js?v=5"></script>
<script src="theme-toggle.shared.js?v=1"></script>
<script src="header.js?v=8.9.45"></script>
</body>
</html>
